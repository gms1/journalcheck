[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "journalcheck"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "systemd-python",
    "PyYAML",
]
license = {text = "MIT"}

[project.urls]
Repository = "https://github.com/gms1/journalcheck"

[project.scripts]
journalcheck = "journalcheck.journalcheck:main"

[tool.setuptools.dynamic]
version = {attr = "journalcheck.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
mypy_path = "stubs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=journalcheck --cov-report=term-missing --cov-report=html"
