name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsystemd-dev libsqlite3-dev
        pip install -e .
        pip install -r requirements.txt
    - name: Lint
      run: ./scripts/lint.sh
    - name: Test
      run: ./scripts/test.sh
    - name: Build Python package
      run: |
        ./scripts/build.sh
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
    - name: Build Debian package
      run: |
        ./scripts/debian.sh
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*
