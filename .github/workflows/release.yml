name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsystemd-dev libsqlite3-dev
        pip install -e .
        pip install -r requirements.txt
    - name: Lint
      run: ./scripts/lint.sh
    - name: Test
      run: ./scripts/test.sh
    - name: Build Python package
      run: |
        ./scripts/build.sh
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
    - name: Build Debian package
      run: |
        ./scripts/debian.sh
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*
    - name: Update APT Repository
      uses: dev-drprasad/debian-package-repository-action@v2
      with:
        gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
        gpg_passphrase: ${{ secrets.GPG_PASSPHRASE }}
        reprepro_src: false
        package_directory: 'dist' # directory containing the .deb package
        repository_name: 'journalcheck'
        branch: gh-pages
        github_token: ${{ secrets.GITHUB_TOKEN }}
        public_key: public.gpg
        base_path: apt
