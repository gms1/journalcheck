name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build Python package
      run: |
        ./scripts/build.sh
    - name: Build Debian package
      run: |
        ./scripts/debian.sh
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*
